<text x="1390" y="492" text-anchor="middle" class="s">CRACKER FUSE</text>
<path class="wfd" d="M1330 470V560H1480"/>
<path class="wf" d="M1480 560V340"/>
<text x="1400" y="582" text-anchor="middle" class="s">LONG WIRE (RETURN)</text>

<rect x="1430" y="260" width="100" height="80" rx="8" class="box" stroke="#ff4fd8"/>
<text x="1480" y="293" text-anchor="middle" class="tb" style="font-size:12px">BATTERY B</text>
<text x="1480" y="311" text-anchor="middle" class="s">2S Li-ion 7.4V</text>
<text x="1493" y="256" class="s">+</text>
<text x="1493" y="356" class="s">−</text>
<text x="1195" y="620" style="fill:#ff9a9a;font-size:13px;font-weight:700">Battery B (−) must NOT connect to ESP32 GND</text>

<rect x="40" y="380" width="360" height="360" rx="14" class="box"/>
<text x="56" y="406" class="h">WIRE COLOURS</text>
<path class="w5" d="M56 430H100"/><text x="112" y="434" class="t" style="font-size:13px">5V power</text>
<path class="w33" d="M56 456H100"/><text x="112" y="460" class="t" style="font-size:13px">3.3V power</text>
<path class="ws" d="M56 482H100"/><text x="112" y="486" class="t" style="font-size:13px">Signal (GPIO / I2C)</text>
<path class="wg" d="M56 508H100"/><text x="112" y="512" class="t" style="font-size:13px">Ground</text>
<path class="wf" d="M56 534H100"/><text x="112" y="538" class="t" style="font-size:13px">High-current firing path</text>
<text x="56" y="578" class="h">NOTES</text>
<text x="56" y="604" class="t" style="font-size:13px">1. Set the buck converter to exactly 5.0V</text>
<text x="70" y="622" class="s">before connecting the ESP32 and relay.</text>
<text x="56" y="648" class="t" style="font-size:13px">2. Wires crossing without a dot are not</text>
<text x="70" y="666" class="s">connected.</text>
<text x="56" y="692" class="t" style="font-size:13px">3. Use an active buzzer, not a passive one.</text>
<text x="56" y="718" class="t" style="font-size:13px">4. Test everything with no cracker attached.</text>

<text x="800" y="1060" text-anchor="middle" fill="#6f7b96" font-size="13">TechTadka360 · github.com/Mr-soumik · Educational project: adults only, keep 10+ metres away</text>
</svg>
