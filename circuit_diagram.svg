<text x="1305" y="428" text-anchor="end" class="tb" style="font-size:12px">NICHROME</text>
<text x="1305" y="445" text-anchor="end" class="s">1.5 – 3 Ω</text>
<text x="1342" y="318" class="tb" style="font-size:12px">LONG WIRE</text>
<text x="1342" y="335" class="s">5 – 10 m</text>
<text x="1342" y="351" class="s">≥ 1 sq mm</text>
