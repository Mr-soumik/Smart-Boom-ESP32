<circle cx="1080" cy="930" r="4.5" class="dot"/>
<text x="760" y="952" text-anchor="middle" class="s">COMMON GND RAIL</text>

<rect x="1180" y="60" width="380" height="590" rx="16" class="dash" stroke="#ff4fd8"/>
<text x="1195" y="90" class="h" style="fill:#ff4fd8;font-size:11px;letter-spacing:1.5px">FIRING CIRCUIT · ISOLATED · HIGH CURRENT</text>
<text x="1195" y="122" class="tb" style="font-size:12px">MASTER SWITCH (SW2)</text>
<text x="1195" y="138" class="s" style="fill:#ff9a9a">keep OFF until at a safe distance</text>

<path class="wf" d="M1100 190H1200"/>
<circle cx="1200" cy="190" r="5" class="dot"/>
<circle cx="1250" cy="190" r="5" class="dot"/>
