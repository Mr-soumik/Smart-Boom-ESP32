<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" font-family="Segoe UI, Arial, sans-serif">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#141c30" stroke-width="1"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.t{fill:#e6edf7;font-size:14px}
.tb{fill:#ffffff;font-size:15px;font-weight:700}
.s{fill:#9aa4b8;font-size:12px}
.h{fill:#ffb800;font-weight:700;font-size:13px;letter-spacing:2px}
.pin{fill:#cfe0ff;font-size:12px;font-weight:600}
.box{fill:#121a2e;stroke:#3a4a78;stroke-width:2}
.dash{fill:none;stroke:#44527a;stroke-width:2;stroke-dasharray:8 6}
.w5{stroke:#ff6b6b;stroke-width:3;fill:none;stroke-linejoin:round}
.w33{stroke:#ffa733;stroke-width:3;fill:none;stroke-linejoin:round}
.wg{stroke:#9aa4b8;stroke-width:3;fill:none;stroke-linejoin:round}
.ws{stroke:#ffd84d;stroke-width:3;fill:none;stroke-linejoin:round}
.wf{stroke:#ff4fd8;stroke-width:4.5;fill:none;stroke-linejoin:round}
.wfd{stroke:#ff4fd8;stroke-width:4.5;fill:none;stroke-dasharray:12 7;stroke-linejoin:round}
.dot{fill:#ffffff}
</style>
</defs>
<rect width="1600" height="1100" fill="#0b0f1a"/>
<rect width="1600" height="1100" fill="url(#grid)"/>

<text x="800" y="40" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="800" letter-spacing="3">SMART BOOM · ESP32 REMOTE CRACKER IGNITER</text>
<text x="800" y="64" text-anchor="middle" fill="#ffb800" font-size="15" font-weight="700" letter-spacing="4">CIRCUIT DIAGRAM · TECHTADKA360</text>

<rect x="30" y="120" width="400" height="190" rx="14" class="dash"/>
<text x="46" y="142" class="h">LOGIC SUPPLY</text>

